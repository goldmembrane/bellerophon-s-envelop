<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오스티나토 일반 보행 적용 요약</title><style>body{margin:0;background:#0b0f13;color:#edf3f7;font-family:system-ui,sans-serif}main{width:min(1080px,94vw);margin:38px auto 70px}h1{margin:0 0 8px;font-size:28px}p{color:#aab8c4;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}section{background:#121921;border:1px solid #293542;border-radius:14px;padding:16px}img{display:block;width:100%;background:#080b0e;border-radius:9px}.controls{display:flex;gap:10px;align-items:center;margin-top:12px}button{background:#3e5f3b;color:white;border:0;border-radius:8px;padding:9px 14px}input{flex:1}code{color:#b8d596}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>오스티나토 일반 보행 적용 요약</h1><p>3번 슬롯에서 Unity Play Mode의 실제 Animator가 보행 클립을 두 주기 반복 재생한 결과입니다. 메시는 변경하지 않았고, 전체 몸통 색조와 갑각 표면 반응은 승인된 <code>Ostinato_Approved_Chitin</code> 설정에서 동기화했습니다.</p><div class="grid"><section><h2>보행 반복 재생</h2><img id="frame" alt="오스티나토 보행 모션"><div class="controls"><button id="toggle">일시정지</button><input id="seek" type="range" min="0" max="25" value="0"><output id="counter"></output></div></section><section><h2>승인 정적 외형 기준</h2><img src="../ostinato_approved_material_2026-07-18/Ostinato_ApprovedMaterial_FinalComparison.png" alt="승인 정적 오스티나토 비교"><p>단일 서브메시 제약에 따라 눈·연조직·칼날을 별도 머티리얼로 나누지 않고, 몸통 중심의 색과 재질 반응만 맞췄습니다.</p></section></div><script>const count=26,fps=12;let i=0,playing=true;const img=document.querySelector('#frame'),seek=document.querySelector('#seek'),counter=document.querySelector('#counter'),toggle=document.querySelector('#toggle');function show(){img.src='runtime_frames/frame_'+String(i).padStart(4,'0')+'.png';seek.value=i;counter.value=(i+1)+' / '+count;}setInterval(()=>{if(playing){i=(i+1)%count;show();}},1000/fps);toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'일시정지':'재생';};seek.oninput=()=>{i=Number(seek.value);show();};show();</script></main></body></html>
