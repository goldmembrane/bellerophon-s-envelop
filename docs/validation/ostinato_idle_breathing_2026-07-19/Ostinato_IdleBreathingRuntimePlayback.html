<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오스티나토 일반 대기 실제 재생</title><style>body{margin:0;background:#090d12;color:#e6edf3;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}main{width:min(960px,94vw)}h1{font-size:24px;margin:0 0 8px}p{color:#9fb0c0;margin:0 0 18px}img{display:block;width:100%;background:#070a0e;border:1px solid #273342;border-radius:12px}.controls{display:flex;gap:10px;align-items:center;margin-top:14px}button{background:#27384a;color:white;border:0;border-radius:8px;padding:9px 14px}input{flex:1}</style></head><body><main><h1>오스티나토 일반 대기 실제 Animator 재생</h1><p>Unity Play Mode에서 캡처한 두 호흡 주기입니다. 위는 전신, 아래는 유기체 확대 화면입니다.</p><img id="frame" alt="오스티나토 호흡 모션"><div class="controls"><button id="toggle">일시정지</button><input id="seek" type="range" min="0" max="77" value="0"><output id="counter"></output></div><script>const count=78,fps=12;let i=0,playing=true;const img=document.querySelector('#frame'),seek=document.querySelector('#seek'),counter=document.querySelector('#counter'),toggle=document.querySelector('#toggle');function show(){img.src='runtime_frames/frame_'+String(i).padStart(4,'0')+'.png';seek.value=i;counter.value=(i+1)+' / '+count;}setInterval(()=>{if(playing){i=(i+1)%count;show();}},1000/fps);toggle.onclick=()=>{playing=!playing;toggle.textContent=playing?'일시정지':'재생';};seek.oninput=()=>{i=Number(seek.value);show();};show();</script></main></body></html>
