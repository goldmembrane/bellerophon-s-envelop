<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Longa Arma Animation-Ready Model</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #111615; color: #e8eee9; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px; }
    h1 { font-size: 28px; margin: 0 0 10px; }
    p { color: #b9c5bd; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    figure { margin: 0; background: #1b2321; border: 1px solid #2f3b37; border-radius: 6px; overflow: hidden; }
    img { width: 100%; display: block; }
    figcaption { padding: 10px 12px; color: #cfd8d2; font-size: 14px; }
    code { color: #d6ffc9; }
  </style>
</head>
<body>
  <main>
    <h1>Longa Arma Animation-Ready Model</h1>
    <p>원본 <code>enemies model/longa arma.blend</code>를 기준으로 애니메이션을 넣을 수 있게 분절형 로우폴리 구조로 재제작한 샘플입니다. 이 페이지는 최종 애니메이션이 아니라 모델 구조 검토용입니다.</p>
    <div class="grid">
      <figure><img src="renders/01_neutral_front.png" /><figcaption>01_neutral_front.png</figcaption></figure>
<figure><img src="renders/02_side_structure.png" /><figcaption>02_side_structure.png</figcaption></figure>
<figure><img src="renders/03_move_crawl_structure_check.png" /><figcaption>03_move_crawl_structure_check.png</figcaption></figure>
<figure><img src="renders/04_attack_lift_structure_check.png" /><figcaption>04_attack_lift_structure_check.png</figcaption></figure>
<figure><img src="renders/05_death_puddle_structure_check.png" /><figcaption>05_death_puddle_structure_check.png</figcaption></figure>
    </div>
  </main>
</body>
</html>
