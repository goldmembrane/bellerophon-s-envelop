  <style>
    body { margin: 0; background: #101414; color: #eee9dc; font-family: Arial, sans-serif; }

<body>
<main>
  <h1>ck_ctl02</h1>
  <p>CK-02 메인 조종대 승인용 Blender 샘플입니다. 실제 Unity 씬에는 아직 연결하지 않았습니다.</p>
  <p>전면 창문과 벽은 배치 확인용 프록시이며, 승인 대상은 화면이 없는 조종대 본체, 타륜형 조작 핸들, 오른쪽 전진 레버입니다.</p>
  <section class="grid">
    <figure><a href="renders/01_front.png"><img src="renders/01_front.png" alt="전면 창문과 조종대 배치"></a><figcaption>전면 창문과 조종대 배치</figcaption></figure>

<figure><a href="renders/03_side.png"><img src="renders/03_side.png" alt="측면 높이와 깊이"></a><figcaption>측면 높이와 깊이</figcaption></figure>
<figure><a href="renders/04_top.png"><img src="renders/04_top.png" alt="상단 배치 기준"></a><figcaption>상단 배치 기준</figcaption></figure>
<figure><a href="renders/05_detail.png"><img src="renders/05_detail.png" alt="타륜과 전진 레버 상세"></a><figcaption>타륜과 전진 레버 상세</figcaption></figure>
  </section>
