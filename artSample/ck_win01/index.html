  <h1>ck_win01</h1>
  <p>조종실 전면 단일 유리창과 내부 파노라마 화면 승인용 Blender 샘플입니다. 실제 Unity 씬에는 아직 적용하지 않았습니다.</p>
  <p>5분할 창과 중앙 멀리언을 제거했고, 조종대, 콘솔, 복도 연결은 제외했습니다. 회색 반투명 구조는 전면 개구부에 붙는 배치 기준만 보여줍니다.</p>
  <section class="grid">
    <figure><a href="renders/01_front.png"><img src="renders/01_front.png" alt="정면: 단일 유리와 내부 화면"></a><figcaption>정면: 단일 유리와 내부 화면</figcaption></figure>
<figure><a href="renders/02_inside.png"><img src="renders/02_inside.png" alt="실내 시점: 조종 시야를 막지 않는 화면 구성"></a><figcaption>실내 시점: 조종 시야를 막지 않는 화면 구성</figcaption></figure>
<figure><a href="renders/03_diag.png"><img src="renders/03_diag.png" alt="대각: 유리, 화면, 외곽 프레임 두께"></a><figcaption>대각: 유리, 화면, 외곽 프레임 두께</figcaption></figure>
