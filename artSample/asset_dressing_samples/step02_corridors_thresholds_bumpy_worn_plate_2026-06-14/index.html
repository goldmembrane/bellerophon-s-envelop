<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>2단계 복도 요철 철판 낡은 버전 시안</title>
  <style>
    body {
      margin: 0;
      background: #080908;
      color: #edf1ee;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: #c8d0cc;
      line-height: 1.65;
    }
    figure {
      margin: 28px 0;
      border: 1px solid #39403b;
      background: #111411;
      padding: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      margin-top: 10px;
      color: #d8dfdb;
      font-size: 16px;
      line-height: 1.5;
    }
    .status {
      border-left: 4px solid #b36b35;
      padding: 12px 16px;
      background: #171714;
      color: #f1d0ad;
      margin: 20px 0 28px;
    }
  </style>
</head>
<body>
  <main>
    <h1>2단계 복도 요철 철판 낡은 버전 시안</h1>
    <p>요철 철판 질감을 복도 내부 바닥, 좌우 벽, 천장에 덮고 녹, 기름때, 그을음, 긁힘을 추가한 검토용 시안입니다. 아직 실제 게임 씬에는 적용하지 않았습니다.</p>
    <div class="status">미승인 상태입니다. 명시 승인 전에는 실제 게임 씬에 적용하지 않습니다.</div>

    <figure>
      <img src="view_01_player_entry.png" alt="플레이어가 복도에 진입할 때 보는 요철 철판 복도">
      <figcaption>플레이어가 복도에 진입할 때 보는 시점입니다. 내부 표면이 요철 철판으로 덮였고 낡은 흔적이 분명한지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_02_threshold_diagonal.png" alt="입구와 초입의 낡은 요철 철판을 보는 대각선 시점">
      <figcaption>입구와 초입을 보는 대각선 시점입니다. 통로가 막히지 않으면서 벽면 얼룩과 녹이 읽히는지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_03_layout_topdown.png" alt="직선 복도와 꺾임 후보를 함께 보는 상단 시점">
      <figcaption>직선 복도와 꺾임 후보를 함께 보는 상단 시점입니다. 구조 변경 없이 표면 덮개만 바뀐 방향인지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_04_module_stack.png" alt="복도 내부에서 바닥 벽 천장 요철 철판을 가까이 보는 시점">
      <figcaption>복도 내부 표면을 가까이 보는 시점입니다. 바닥, 벽, 천장에 요철과 낡음 표현이 충분히 보이는지 확인합니다.</figcaption>
    </figure>
  </main>
</body>
</html>
