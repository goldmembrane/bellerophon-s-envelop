<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>이단계 복도와 입구 실제 에셋 적용 시안</title>
  <style>
    body {
      margin: 0;
      background: #0e1113;
      color: #eef3ef;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: #c5cec9;
      line-height: 1.65;
    }
    figure {
      margin: 28px 0;
      border: 1px solid #3e4a47;
      background: #151a1c;
      padding: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      margin-top: 10px;
      color: #d7ded9;
      font-size: 16px;
      line-height: 1.5;
    }
    .status {
      border-left: 4px solid #e6a03e;
      padding: 12px 16px;
      background: #171c1d;
      color: #f3dfb8;
      margin: 20px 0 28px;
    }
  </style>
</head>
<body>
  <main>
    <h1>이단계 복도와 입구 실제 에셋 적용 시안</h1>
    <p>현재 임포트된 복도, 벽, 바닥, 조명 후보를 골라 임시 배치한 뒤 여러 시점에서 렌더링한 검토본입니다. 현재 유니티 씬에 이미 들어간 결과는 기준으로 삼지 않습니다.</p>
    <div class="status">미승인 상태입니다. 명시 승인 전에는 실제 게임 씬에 추가 적용하지 않습니다.</div>

    <figure>
      <img src="view_01_player_entry.png" alt="플레이어가 복도로 진입할 때의 시점">
      <figcaption>플레이어가 복도로 진입할 때의 시점입니다. 직선 복도 골격, 바닥 보강판, 벽 받침, 조명 반복을 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_02_threshold_diagonal.png" alt="입구와 초입 장식이 보이는 대각선 시점">
      <figcaption>입구와 초입 장식이 보이는 대각선 시점입니다. 중앙을 막는 벽처럼 보이는지, 좌우 기둥과 상단 보강재만 남는지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_03_layout_topdown.png" alt="직선 복도와 꺾임 후보를 함께 보는 배치 시점">
      <figcaption>직선 복도와 꺾임 후보를 함께 보는 배치 시점입니다. 통로 폭, 연결부, 장식이 튀어나오는 부분을 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_04_module_stack.png" alt="복도 안쪽에서 벽 바닥 천장 조합을 가까이 보는 시점">
      <figcaption>복도 안쪽에서 벽, 바닥, 천장 조합을 가까이 보는 시점입니다. 반복되는 골격과 조명이 밍밍한 덩어리처럼 보이지 않는지 확인합니다.</figcaption>
    </figure>
  </main>
</body>
</html>
