<main>
  <h1>ck_dmg09</h1>
  <p>CK-09 조종대 파손 / 폭파 상태 부품 샘플입니다. 아직 Unity 씬에는 적용하지 않았습니다.</p>
  <p>이 샘플은 승인된 <code>ck_ctl02_low</code> Blender 파일의 원본 오브젝트를 불러온 뒤, 원본 타륜과 오른쪽 전진 레버를 파손 상태로 변형한 버전입니다.</p>
  <div class="notice">조건: 승인 후 Unity에 붙일 경우 <code>조종실 내구도 0%</code>일 때만 기존 CK-02 조종대를 숨기고 이 파손 상태를 표시합니다.</div>
  <section class="grid">
    <figure><a href="renders/01_front.png"><img src="renders/01_front.png" alt="전면: 조종대 폭파 상태 전체"></a><figcaption>전면: 조종대 폭파 상태 전체</figcaption></figure>
<figure><a href="renders/02_player.png"><img src="renders/02_player.png" alt="플레이어 접근 방향: 통행을 막지 않는 파손 상태"></a><figcaption>플레이어 접근 방향: 통행을 막지 않는 파손 상태</figcaption></figure>
<figure><a href="renders/03_side.png"><img src="renders/03_side.png" alt="측면: 조종대 높이와 전면 화면 거리"></a><figcaption>측면: 조종대 높이와 전면 화면 거리</figcaption></figure>
<figure><a href="renders/04_top.png"><img src="renders/04_top.png" alt="상단: 파편과 그을림 범위"></a><figcaption>상단: 파편과 그을림 범위</figcaption></figure>
<figure><a href="renders/05_detail.png"><img src="renders/05_detail.png" alt="상세: 부서진 타륜, 휘어진 레버, 노출 배선"></a><figcaption>상세: 부서진 타륜, 휘어진 레버, 노출 배선</figcaption></figure>
<figure><a href="renders/06_condition_swap.png"><img src="renders/06_condition_swap.png" alt="조건부 교체 확인: 정상 조종대 위치의 파손 상태"></a><figcaption>조건부 교체 확인: 정상 조종대 위치의 파손 상태</figcaption></figure>
