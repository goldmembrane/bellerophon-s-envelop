<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>2단계 복도 내부 철판 덮개 시안</title>
  <style>
    body {
      margin: 0;
      background: #090c0c;
      color: #edf2ef;
      font-family: "Malgun Gothic", Arial, sans-serif;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 56px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 18px;
      color: #c8d0cc;
      line-height: 1.65;
    }
    figure {
      margin: 28px 0;
      border: 1px solid #36413d;
      background: #111615;
      padding: 12px;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    figcaption {
      margin-top: 10px;
      color: #d8dfdb;
      font-size: 16px;
      line-height: 1.5;
    }
    .status {
      border-left: 4px solid #a9a46a;
      padding: 12px 16px;
      background: #151918;
      color: #eee7ba;
      margin: 20px 0 28px;
    }
  </style>
</head>
<body>
  <main>
    <h1>2단계 복도 내부 철판 덮개 시안</h1>
    <p>현재 프로젝트에 가져온 에셋 중 철판형 부품을 골라, 복도 내부 바닥과 좌우 벽, 천장 안쪽을 덮은 검토용 시안입니다. 기존 낡은 버전은 이번 기준에서 제외했습니다.</p>
    <div class="status">미승인 상태입니다. 명시 승인 전에는 실제 게임 씬에 적용하지 않습니다.</div>

    <figure>
      <img src="view_01_player_entry.png" alt="플레이어가 복도에 진입할 때 보는 철판 덮개 시점">
      <figcaption>플레이어가 복도에 진입할 때 보는 시점입니다. 복도 내부가 빈 껍데기처럼 보이지 않고 철판으로 덮였는지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_02_threshold_diagonal.png" alt="입구와 초입의 철판 덮개를 보는 대각선 시점">
      <figcaption>입구와 초입을 보는 대각선 시점입니다. 중앙 통로가 막히지 않고 좌우 벽과 천장 안쪽에 철판이 보이는지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_03_layout_topdown.png" alt="직선 복도와 꺾임 후보를 함께 보는 상단 시점">
      <figcaption>직선 복도와 꺾임 후보를 함께 보는 상단 시점입니다. 철판 덮개가 전체 구조를 과하게 바꾸지 않는지 확인합니다.</figcaption>
    </figure>
    <figure>
      <img src="view_04_module_stack.png" alt="복도 안쪽에서 바닥 벽 천장 철판 조합을 가까이 보는 시점">
      <figcaption>복도 안쪽에서 바닥, 벽, 천장 철판 조합을 가까이 보는 시점입니다. 실제 적용 시 가장 중요하게 맞출 내부 표면 느낌을 확인합니다.</figcaption>
    </figure>
  </main>
</body>
</html>
