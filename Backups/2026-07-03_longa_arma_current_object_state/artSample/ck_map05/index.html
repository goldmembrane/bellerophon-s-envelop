<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ck_map05</title>
  <style>
    body { margin: 0; background: #101414; color: #eee9dc; font-family: Arial, sans-serif; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #cdc5b8; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; border: 1px solid #39413f; background: #1b2220; padding: 10px; }
    img { width: 100%; display: block; background: #060807; }
    figcaption { margin-top: 8px; color: #ddd4c6; font-size: 14px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

<body>
<main>
  <h1>ck_map05</h1>
  <p>CK-05 화물선 전개도 / 구역 내구도 표시 패널 샘플입니다. 아직 Unity 씬에는 적용하지 않았습니다.</p>
  <p>수동 운행 UI 전체가 아니라, 조종실 내부에서 구역 상태를 확인할 수 있는 물리 패널 형태의 모델링 시안입니다.</p>
  <section class="grid">
    <figure><a href="renders/01_front.png"><img src="renders/01_front.png" alt="정면: 조종대 왼쪽 하단 패널 배치"></a><figcaption>정면: 조종대 왼쪽 하단 패널 배치</figcaption></figure>
<figure><a href="renders/02_player.png"><img src="renders/02_player.png" alt="플레이어 시점: 조종대 옆에서 보이는 전개도"></a><figcaption>플레이어 시점: 조종대 옆에서 보이는 전개도</figcaption></figure>
<figure><a href="renders/03_detail.png"><img src="renders/03_detail.png" alt="상세: 6구역 전개도와 내구도 색상"></a><figcaption>상세: 6구역 전개도와 내구도 색상</figcaption></figure>
<figure><a href="renders/04_top.png"><img src="renders/04_top.png" alt="상단: 조종대와 패널 위치 관계"></a><figcaption>상단: 조종대와 패널 위치 관계</figcaption></figure>
<figure><a href="renders/05_side.png"><img src="renders/05_side.png" alt="측면: 패널 두께와 마운트 브래킷"></a><figcaption>측면: 패널 두께와 마운트 브래킷</figcaption></figure>
  </section>
</main>
