<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cockpit_01</title>
  <style>
    body { margin: 0; background: #151817; color: #e8e1d2; font-family: Arial, sans-serif; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { color: #c8c0af; line-height: 1.55; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    figure { margin: 0; border: 1px solid #3e453f; background: #202521; padding: 10px; }
    img { width: 100%; display: block; background: #0c0f0e; }
    figcaption { margin-top: 8px; color: #d9cfba; font-size: 14px; }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>cockpit_01</h1>
  <p>조종실 방 자체의 전체 구조만 확인하는 Blender 시안입니다. 복도, 조종대, 유리 내부 구조, 콘솔, 화면은 포함하지 않았습니다.</p>
  <section class="grid">
    <figure><a href="renders/01_top.png"><img src="renders/01_top.png" alt="상단 구조"></a><figcaption>상단 구조</figcaption></figure>
<figure><a href="renders/02_front.png"><img src="renders/02_front.png" alt="전면 개구부"></a><figcaption>전면 개구부</figcaption></figure>
<figure><a href="renders/03_rear.png"><img src="renders/03_rear.png" alt="후방 중심 줄기"></a><figcaption>후방 중심 줄기</figcaption></figure>
<figure><a href="renders/04_diag.png"><img src="renders/04_diag.png" alt="대각 구조"></a><figcaption>대각 구조</figcaption></figure>
  </section>
</main>
</body>
</html>
