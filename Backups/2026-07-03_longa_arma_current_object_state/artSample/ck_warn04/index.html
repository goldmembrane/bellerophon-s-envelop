  <h1>ck_warn04</h1>
  <p>CK-04 경고등 / 작은 물리 표시등 승인된 Blender 샘플입니다. 승인 후 CargoRunMvp에 적용했습니다.</p>
  <p>좌우 벽면 경고등과 붉은 회전광 빔 모델은 제외했습니다. 이번 샘플은 스크린 위 경고등 바와 천장 비상 경고등 본체만 다룹니다.</p>
  <p>Unity 적용 시 천장 비상 경고등은 조종실 천장 한가운데에 배치합니다.</p>
  <p>Unity 적용 비교 캡처는 <a href="unity_applied_comparison/index.html">unity_applied_comparison/index.html</a>에서 확인합니다.</p>
